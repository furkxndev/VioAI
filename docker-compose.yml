services:
  postgres:
    image: postgres:17-alpine
    container_name: vioai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-vioai}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-vioai_dev_password}
      POSTGRES_DB: ${DATABASE_NAME:-vioai}
    ports:
      - '${DATABASE_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DATABASE_USER:-vioai} -d ${DATABASE_NAME:-vioai}']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      target: development
    container_name: vioai-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
    ports:
      - '${PORT:-3000}:3000'
    volumes:
      - ./backend/src:/app/src
      - ./backend/package.json:/app/package.json
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
